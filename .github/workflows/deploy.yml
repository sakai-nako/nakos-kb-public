name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.repository == 'sakai-nako/nakos-kb-public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      # lock はミラーに含めないので凍結なしで解決する (README のビルド節)。
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter kb run build
      - run: npx --yes wrangler@4 pages deploy packages/kb/dist --project-name=nakos-kb --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
